[tool.poetry]
name = "webtonotion"
version = "0.1.0"
description = "A FastAPI application to process URLs and create Notion pages."
authors = ["Your Name <you@example.com>"]

[tool.poetry.dependencies]
python = "^3.12"
fastapi = "^0.109.2"
uvicorn = "^0.27.1"
pydantic = "^2.6.1"
pydantic-settings = "^2.2.1"
python-dotenv = "^1.0.1"
playwright = "^1.42.0"
notion-client = "^2.0.0"
logfire = "^0.5.0"
pydantic-ai = "^0.1.0"

[tool.poetry.dev-dependencies]
pytest = "^7.4.4"
httpx = "^0.26.0"

[build-system]
requires = ["poetry-core>=1.0.0"]
build-backend = "poetry.core.masonry.api"