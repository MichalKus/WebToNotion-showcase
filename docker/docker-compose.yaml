services:
  webtonotion:
    image: ${WEBTONOTION_IMAGE:-mikus67/webtonotion:prod}
    container_name: ${COMPOSE_PROJECT_NAME:-webtonotion-prod}
    networks:
      - app-network
    env_file:
      - .env
    volumes:
      - webtonotion_cache:/app/cache
      - ./cookies.txt:/app/cookies.txt:ro
    ports:
      - "${PORT:-8000}:8000"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/v1/health/"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s
    # 2GB VPS: cap the container so a Whisper/ffmpeg spike cannot take the host
    # down, and rotate logs so json-file cannot fill the disk.
    # Leaves ~512MB headroom for the host OS, reverse proxy, and Docker daemon.
    mem_limit: 1536m
    memswap_limit: 1536m
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

networks:
  app-network:
    name: app-network
    external: true

volumes:
  webtonotion_cache:
    external: true
    name: ${CACHE_VOLUME_NAME:-webtonotion_webtonotion_cache}
